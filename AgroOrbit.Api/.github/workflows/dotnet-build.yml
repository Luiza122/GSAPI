name: Build .NET API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./AgroOrbit.Api/AgroOrbit.Api/AgroOrbit.Api.csproj

      - name: Build project
        run: dotnet build ./AgroOrbit.Api/AgroOrbit.Api/AgroOrbit.Api.csproj --configuration Release --no-restore
